---
# Builds Buoy Desktop for all platforms and publishes a release on this repo.
#
# Source code lives in the PRIVATE Buoy-gg/buoy-packages monorepo; this
# workflow checks it out via the PRIVATE_REPO_TOKEN secret (fine-grained PAT
# with read access to that repo). The workflow runs here so that:
#   - the Apple signing secrets stay where they already were
#   - Actions minutes are free (public repo), incl. the 10x-cost macOS runners
#   - releases land on this repo, which the app's auto-updater
#     (update.electronjs.org) watches
#
# Triggered by scripts/release.sh in the monorepo (or manually from the
# Actions tab).
name: Build/release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "buoy-packages git ref (SHA or branch) to build"
        required: true
        default: "main"
      draft:
        description: "Leave the release as a draft"
        required: false
        default: false
        type: boolean
      notes:
        description: "Release notes body"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out app package.json from private repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Buoy-gg/buoy-packages
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          sparse-checkout: apps/desktop/package.json
          sparse-checkout-cone-mode: false

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Buoy Desktop v$VERSION from ${{ inputs.ref }}"

  build:
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        arch: [x64, arm64]

    steps:
      - name: Check out private source repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Buoy-gg/buoy-packages
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.10.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Import signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 -D > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Build and package app
        working-directory: apps/desktop
        env:
          # osxSign/osxNotarize only apply to darwin packaging; these are
          # ignored on the windows/linux runners.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm run make --arch=${{ matrix.arch }}

      # Open the packaged app before anything ships: it must boot its window,
      # answer on the broker port and quit on SIGTERM. Catches what only the
      # packaged build can break (asar fuses, native helpers, a crash on
      # start). Runs where the runner can run this arch.
      - name: Launch check (the packaged app opens)
        if: (runner.arch == 'ARM64' && matrix.arch == 'arm64') || (runner.arch == 'X64' && matrix.arch == 'x64')
        working-directory: apps/desktop
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) APP="out/Buoy-darwin-${{ matrix.arch }}/Buoy.app" ;;
            Windows) APP="out/Buoy-win32-${{ matrix.arch }}" ;;
            Linux) APP="out/Buoy-linux-${{ matrix.arch }}" ;;
          esac
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum node scripts/smoke-packaged-app.mjs --app "$APP"
          else
            node scripts/smoke-packaged-app.mjs --app "$APP"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            apps/desktop/out/make/**/*.zip
            apps/desktop/out/make/**/*.dmg
          if-no-files-found: error

  release:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      # Only for scripts/ (the update-manifest generator) — the app itself
      # was already built from this ref in the build job.
      - name: Check out private source repo (scripts)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Buoy-gg/buoy-packages
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: source

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ./downloaded-artifacts

      # Rename forge's "Buoy-<platform>-<arch>-<version>.zip" to names humans
      # can pick from a release page. The mapping is LOAD-BEARING for both
      # update feeds (update.electronjs.org picks mac assets by filename;
      # electron-updater matches arch tokens in latest-mac.yml), so it lives
      # in a unit-tested script instead of inline sed — see
      # apps/desktop/src/__tests__/releaseAssetNames.test.ts.
      - name: Give downloads readable names
        run: node source/apps/desktop/scripts/rename-release-assets.mjs --dir downloaded-artifacts

      # electron-updater feed (the in-app update pill). Gathers the renamed
      # mac zips into one dir and writes latest-mac.yml (sha512 + size per
      # arch) next to them; the release step uploads it with the zips. The
      # update.electronjs.org (Squirrel) feed above is untouched — clients
      # older than 2.0.12 still update through it.
      - name: Generate electron-updater manifest (latest-mac.yml)
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p release-feed
          find downloaded-artifacts -name '*macOS*.zip' -exec cp {} release-feed/ \;
          ls -l release-feed
          node source/apps/desktop/scripts/generate-update-manifest.mjs \
            --dir release-feed --version "$VERSION"

      - name: Write release notes with download guide
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/v$VERSION"
          cat > release-body.md <<EOF
          ${NOTES:-Buoy Desktop $VERSION}

          ### Which download do I need?

          | Your machine | Download |
          | --- | --- |
          | Mac — Apple chip (M1/M2/M3/M4) | [Buoy-macOS-AppleSilicon-arm64-$VERSION.dmg]($BASE/Buoy-macOS-AppleSilicon-arm64-$VERSION.dmg) |
          | Mac — Intel | [Buoy-macOS-Intel-x64-$VERSION.dmg]($BASE/Buoy-macOS-Intel-x64-$VERSION.dmg) |
          | Windows | [Buoy-Windows-x64-$VERSION.zip]($BASE/Buoy-Windows-x64-$VERSION.zip) |
          | Windows on ARM | [Buoy-Windows-arm64-$VERSION.zip]($BASE/Buoy-Windows-arm64-$VERSION.zip) |
          | Linux | [Buoy-Linux-x64-$VERSION.zip]($BASE/Buoy-Linux-x64-$VERSION.zip) |
          | Linux on ARM | [Buoy-Linux-arm64-$VERSION.zip]($BASE/Buoy-Linux-arm64-$VERSION.zip) |

          *Not sure which Mac you have? Apple menu → About This Mac — "Chip: Apple M…" means Apple chip; "Processor: Intel…" means Intel.*

          On a Mac, open the .dmg and drag Buoy into Applications.

          macOS builds update themselves automatically. Windows and Linux: download the new version from this page.
          EOF

      - name: Create or update release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: v${{ needs.meta.outputs.version }}
          name: Buoy Desktop ${{ needs.meta.outputs.version }}
          bodyFile: release-body.md
          artifacts: "downloaded-artifacts/**/*.zip,downloaded-artifacts/**/*.dmg,release-feed/latest-mac.yml,release-feed/desktop-policy.json"
          allowUpdates: true
          replacesArtifacts: true
          draft: ${{ inputs.draft }}
          prerelease: false
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Homebrew: `brew install --cask buoy-gg/tap/buoy`. Writes the cask for
      # this version (both DMG sha256s) and pushes it to Buoy-gg/homebrew-tap.
      # Needs the HOMEBREW_TAP_TOKEN secret (push access to that repo);
      # without it this step only says so. Drafts are skipped: the cask must
      # point at a published release.
      - name: Update the Homebrew cask
        if: ${{ !inputs.draft }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "No HOMEBREW_TAP_TOKEN secret, so the Homebrew cask was not updated."
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Buoy-gg/homebrew-tap.git" tap
          node source/apps/desktop/scripts/homebrew-cask.mjs --dir downloaded-artifacts --version "$VERSION" --out tap/Casks/buoy.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/buoy.rb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "buoy ${VERSION}"
          git push
